return{FC:[[p+' эшик',H-3,Math.round(W/nd)-3,nd,H>1200?3:2]],MD:[[p,Math.round(W/m),H,D,tall?Math.floor(H/400)-1:1,low?'u':tall?'t':'b',m,1,low?0:1]],X:[],E:{cnt:n=='Остравок'?W/1000:0,tm:n=='Дарс столъ'?2:0,led:n=='Под-тв'?W/1000:0}}}
function rcalc0(c){const FCx=[],MDx=[],X=[],E={cnt:0,tm:0,led:0};let kit=0;itl(c).forEach(k=>{const d=itd(c,k);if(!d.file)return;const g=gen(k,d);FCx.push(...g.FC);MDx.push(...g.MD);X.push(...g.X);kit=kit||g.kit||0;E.cnt+=g.E.cnt||0;E.tm+=g.E.tm||0;E.led+=c.rk.led?(g.E.led||0):0});if(!FCx.length&&!MDx.length&&!X.length){c.R=null;return}const r=rsk(FCx,MDx,X,kit,E);Object.assign(c.rk,r.rk);c.R=r}

function pk(parts,rot){const UW=2780,UH=2050,K=4;let best=null;
